name: App-KI Modell bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ci/ft_final.py','ci/ft_check.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Paare exportieren
        working-directory: ci
        run: node export_pairs.mjs
      - name: Modell trainieren, verkleinern, exportieren
        working-directory: ci
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -1
          pip install --quiet transformers numpy onnx onnxruntime tokenizers huggingface_hub sentencepiece protobuf 2>&1 | tail -1
          python3 ft_final.py 4 2e-5 > ft_final.log 2>&1 || true; tail -40 ft_final.log
      - name: Prüfung in transformers.js
        working-directory: ci
        run: |
          npm init -y >/dev/null; npm install @huggingface/transformers@4.3.0 >/dev/null 2>&1
          node ft_check.mjs 2>&1 | tee ft_check.log | tail -5
      - name: Ergebnis sichern
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r ci/out/e5-ft /tmp/out/ || true; cp ci/ft_final.log ci/ft_check.log /tmp/out/ || true; cd /tmp/out && du -sh . && git init -q -b ci-model && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm "model" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-model
